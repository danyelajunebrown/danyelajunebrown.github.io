<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Sent privately for one opportunity. Keep it out of search. -->
<meta name="robots" content="noindex, nofollow">
<title>Danyela June Brown — Selected Projects</title>
<style>
  :root {
    --ink: #f2f2f0;
    --dim: #7a7a78;
    --ground: #000;
    --type: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body {
    font-family: var(--type);
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: max(6vh, env(safe-area-inset-top)) clamp(20px, 6vw, 96px) 8vh;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ---------- index ---------- */
  header { display: flex; justify-content: space-between; gap: 1em; flex-wrap: wrap; color: var(--dim); margin-bottom: 14vh; }
  header h1, header p { font-size: inherit; font-weight: 400; margin: 0; }
  header h1 { color: var(--ink); }

  ol { list-style: none; margin: 0; padding: 0; }
  li button {
    width: 100%;
    display: flex; justify-content: space-between; align-items: baseline; gap: 1em;
    padding: .28em 0;
    font-size: clamp(26px, 4.4vw, 56px);
    letter-spacing: -.02em;
    line-height: 1.1;
    text-align: left;
    transition: color .25s;
  }
  li .year { font-size: .5em; letter-spacing: 0; color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  ol:hover li button, ol:focus-within li button { color: #3a3a39; }
  ol li button:hover, ol li button:focus-visible { color: var(--ink); outline: none; }
  ol li button:hover .year, ol li button:focus-visible .year { color: var(--ink); }
  li button[data-empty] { cursor: default; }

  /* ---------- viewer ---------- */
  #viewer {
    position: fixed; inset: 0; z-index: 10;
    background: var(--ground);
    display: grid; place-items: center;
  }
  #viewer[hidden] { display: none; }
  #stage { position: absolute; inset: 0; }
  #stage img, #stage video, #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #stage img, #stage video { object-fit: contain; }
  #stage .nomedia { color: var(--dim); }

  /* click-through zones. Images: whole halves. Video/embeds: thin edges, so the player stays usable. */
  .zone { position: absolute; top: 0; bottom: 0; z-index: 2; }
  .zone.prev { left: 0; cursor: w-resize; }
  .zone.next { right: 0; cursor: e-resize; }
  #viewer[data-kind="image"] .zone { width: 50%; }
  #viewer[data-kind="embed"] .zone { width: 7%; top: 12%; bottom: 20%; }
  #viewer[data-single] .zone { display: none; }

  /* details + chrome: appear on movement, fade when still */
  .chrome { position: absolute; z-index: 3; transition: opacity .5s; }
  #viewer.idle .chrome { opacity: 0; pointer-events: none; }
  #close { top: max(18px, env(safe-area-inset-top)); right: 22px; font-size: 13px; padding: 8px; color: var(--ink); text-shadow: 0 0 8px #000; }
  #count { top: max(26px, env(safe-area-inset-top)); left: 30px; font-size: 13px; color: var(--ink); text-shadow: 0 0 8px #000; font-variant-numeric: tabular-nums; }
  #details {
    left: 0; right: 0; bottom: 0;
    padding: 18vh clamp(20px, 3vw, 40px) max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.82));
    pointer-events: none;
    display: grid; grid-template-columns: minmax(0, 22em) minmax(0, 34em); gap: .4em 3em; align-items: end;
  }
  #viewer[data-kind="embed"] #details { bottom: 64px; padding-top: 6vh; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  #details h2 { font-size: 22px; font-weight: 400; letter-spacing: -.01em; margin: 0 0 .25em; }
  #details dl { margin: 0; color: #c9c9c6; }
  #details dl div { display: flex; gap: .6em; }
  #details dt { color: var(--dim); min-width: 4.8em; }
  #details dd { margin: 0; }
  #details p { margin: 0; color: #d8d8d5; max-width: 34em; }
  #details .caption { color: var(--dim); margin-top: .5em; }

  @media (max-width: 700px) {
    #details { grid-template-columns: 1fr; padding-top: 10vh; }
    #viewer[data-kind="image"] .zone { width: 35%; }
  }
  @media (hover: none) {
    /* no hover on phones: details stay up until tapped away */
    #viewer.idle .chrome { opacity: 1; pointer-events: auto; }
    #viewer.hush .chrome { opacity: 0; pointer-events: none; }
    #viewer.hush #close { opacity: 1; pointer-events: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>Danyela June Brown</h1>
  <p>Selected Projects</p>
</header>

<main>
  <ol id="list"></ol>
</main>

<div id="viewer" hidden>
  <div id="stage"></div>
  <button class="zone prev" aria-label="Previous view"></button>
  <button class="zone next" aria-label="Next view"></button>
  <div id="count" class="chrome"></div>
  <button id="close" class="chrome" aria-label="Close">Close ✕</button>
  <div id="details" class="chrome"></div>
</div>

<script>
/*
  THE CONTENT. Edit here.

  One entry per project, in the order they should be listed.
  media is shown full screen in this order; more than one = click through.
    { type: "image",   src: "media/file.jpg" }
    { type: "video",   src: "media/file.mp4" }   (H.264 .mp4 — .MOV/HEVC won't play in Chrome)
    { type: "youtube", id:  "VIDEO_ID" }
    { type: "vimeo",   id:  "VIDEO_ID" }
  Any media item can carry a caption: "…" (e.g. the angle, or who shot it).
  Leave a field "" and it simply won't appear.
*/
const PROJECTS = [
  {
    id: "dysaesthesia-aethiopica-asili",
    title: "Dysaesthesia Aithiopica and Asili",   // spelling as on Danyela's YouTube upload
    year: "",
    medium: "",
    venue: "",
    credits: "",
    text: "",
    media: [
      { type: "youtube", id: "7huAtaUxn_c" },
      { type: "image", src: "media/dysaesthesia-aethiopica-1.jpg" },
      { type: "video", src: "media/asili.mp4" },
      { type: "image", src: "media/asili-2.jpg" },
    ],
  },
  {
    id: "studio-practice",
    title: "Studio Practice",
    year: "2024",
    medium: "",
    venue: "",
    credits: "",
    text: "",
    media: [
      { type: "youtube", id: "BRNuK34OCKI", caption: "excerpt" },
    ],
  },
  {
    id: "rip-dream-johnson",
    title: "RIP Dream Johnson",
    year: "2025", medium: "", venue: "", credits: "", text: "",
    media: [
      { type: "youtube", id: "VL3bCHgXNmo" },
    ],
  },
  {
    id: "all-the-feels",
    title: "All The Feels",
    year: "", medium: "", venue: "", credits: "", text: "",
    media: [
      { type: "image", src: "media/all-the-feels-1.jpg" },
      // TODO: most recent weekly diary-card report goes here
    ],
  },
  {
    id: "out-the-doll-house-ii",
    title: "Out The Doll House II",
    year: "", medium: "", venue: "", credits: "", text: "",
    media: [
      { type: "youtube", id: "ETBAGdcVCH8", caption: "excerpt" },
    ],
  },
];

const $ = (s) => document.querySelector(s);
const list = $("#list"), viewer = $("#viewer"), stage = $("#stage"),
      details = $("#details"), count = $("#count");
let current = null, index = 0, idleTimer = 0;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- index ----------
for (const p of PROJECTS) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.innerHTML = `<span class="title">${esc(p.title)}</span><span class="year">${esc(p.year)}</span>`;
  if (!p.media.length) b.dataset.empty = "";
  b.addEventListener("click", () => { if (p.media.length) location.hash = p.id; });
  li.append(b);
  list.append(li);
}

// ---------- viewer ----------
function render() {
  const p = current, m = p.media[index];
  const kind = m.type === "image" ? "image" : "embed";
  viewer.dataset.kind = kind;
  viewer.toggleAttribute("data-single", p.media.length < 2);
  count.textContent = p.media.length > 1 ? `${index + 1} / ${p.media.length}` : "";

  stage.replaceChildren();
  if (m.type === "image") {
    const img = new Image();
    img.src = m.src;
    img.alt = m.caption || p.title;
    stage.append(img);
  } else if (m.type === "video") {
    const v = document.createElement("video");
    Object.assign(v, { src: m.src, controls: true, loop: true, playsInline: true });
    stage.append(v);
    v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
  } else if (m.type === "youtube" || m.type === "vimeo") {
    const f = document.createElement("iframe");
    f.src = m.type === "youtube"
      ? `https://www.youtube-nocookie.com/embed/${m.id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`
      : `https://player.vimeo.com/video/${m.id}?autoplay=1&title=0&byline=0&portrait=0`;
    f.allow = "autoplay; fullscreen; picture-in-picture";
    f.allowFullscreen = true;
    f.title = p.title;
    stage.append(f);
  }

  const rows = [["Medium", p.medium], ["Venue", p.venue], ["Credits", p.credits]]
    .filter(([, v]) => v)
    .map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("");
  details.innerHTML = `
    <div>
      <h2>${esc(p.title)}</h2>
      ${p.year ? `<dl><div><dt>Year</dt><dd>${esc(p.year)}</dd></div>${rows}</dl>` : rows ? `<dl>${rows}</dl>` : ""}
    </div>
    <div>
      ${p.text ? `<p>${esc(p.text)}</p>` : ""}
      ${m.caption ? `<p class="caption">${esc(m.caption)}</p>` : ""}
    </div>`;

  // warm the next image so clicking through doesn't flash
  const nx = p.media[(index + 1) % p.media.length];
  if (nx && nx.type === "image") new Image().src = nx.src;
  wake();
}

function step(d) {
  if (!current || current.media.length < 2) return;
  index = (index + d + current.media.length) % current.media.length;
  render();
}

function open(p) {
  current = p; index = 0;
  viewer.hidden = false;
  document.body.style.overflow = "hidden";
  render();
}

function close() {
  current = null;
  stage.replaceChildren(); // stops video/embed audio
  viewer.hidden = true;
  document.body.style.overflow = "";
}

// Hash = which project is open, so the browser back button closes it.
function route() {
  const p = PROJECTS.find((x) => x.id === location.hash.slice(1) && x.media.length);
  p ? (p !== current && open(p)) : current && close();
}
addEventListener("hashchange", route);
route();

function leave() { history.length > 1 && location.hash ? history.back() : (location.hash = ""); }

// details show while the pointer moves, fade when it rests
function wake() {
  viewer.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewer.classList.add("idle"), 2200);
}
viewer.addEventListener("mousemove", wake);

$(".zone.prev").addEventListener("click", () => step(-1));
$(".zone.next").addEventListener("click", () => step(1));
$("#close").addEventListener("click", leave);
// phones: tapping the middle of an image toggles the details
stage.addEventListener("click", () => viewer.classList.toggle("hush"));

addEventListener("keydown", (e) => {
  if (!current) return;
  if (e.key === "Escape") leave();
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
});

// swipe
let x0 = null;
viewer.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
viewer.addEventListener("touchend", (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  x0 = null;
});
</script>
</body>
</html>
