<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Sent privately for one opportunity. Keep it out of search. -->
<meta name="robots" content="noindex, nofollow">
<title>Danyela June Brown — Selected Projects</title>
<style>
  :root {
    --ink: #f2f2f0;
    --dim: #7a7a78;
    --ground: #000;
    --type: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body {
    font-family: var(--type);
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: max(6vh, env(safe-area-inset-top)) clamp(20px, 6vw, 96px) 8vh;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ---------- eyewall (the ground) ---------- */
  #wall {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%; display: block;
    background: var(--ground);
    opacity: .62;            /* the list has to stay readable over it */
    pointer-events: none;    /* never eats a click meant for a title */
  }
  #cam { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  header, main { position: relative; z-index: 1; }
  li button { text-shadow: 0 0 18px #000, 0 0 6px #000; }

  /* ---------- index ---------- */
  header { display: flex; justify-content: space-between; gap: 1em; flex-wrap: wrap; color: var(--dim); margin-bottom: 14vh; }
  header h1, header p { font-size: inherit; font-weight: 400; margin: 0; }
  header h1 { color: var(--ink); }

  ol { list-style: none; margin: 0; padding: 0; }
  li button {
    display: block;
    padding: .28em 0;
    font-size: clamp(23px, 3.7vw, 46px);
    letter-spacing: -.02em;
    line-height: 1.15;
    text-align: left;
    transition: color .25s;
  }
  li .year { color: var(--dim); font-variant-numeric: tabular-nums; }
  ol:hover li button, ol:focus-within li button { color: #3a3a39; }
  ol li button:hover, ol li button:focus-visible { color: var(--ink); outline: none; }
  ol li button:hover .year, ol li button:focus-visible .year { color: var(--ink); }
  li button[data-empty] { cursor: default; }

  /* ---------- viewer ---------- */
  #viewer {
    position: fixed; inset: 0; z-index: 10;
    background: var(--ground);
    display: grid; place-items: center;
  }
  #viewer[hidden] { display: none; }
  #stage { position: absolute; inset: 0; }
  #stage img, #stage video, #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #stage img, #stage video { object-fit: contain; }

  /* click-through: a chevron on each side says there is more to see.
     Images take the whole half; video and embeds only the edge, so the player stays usable. */
  .zone {
    position: absolute; top: 0; bottom: 0; z-index: 2;
    display: flex; align-items: center;
    font-size: 34px; line-height: 1; color: var(--ink);
    text-shadow: 0 0 12px #000, 0 0 4px #000;
    opacity: .55; transition: opacity .25s;
  }
  .zone:hover, .zone:focus-visible { opacity: 1; outline: none; }
  .zone.prev { left: 0; justify-content: flex-start; padding-left: 16px; }
  .zone.next { right: 0; justify-content: flex-end; padding-right: 16px; }
  #viewer[data-kind="image"] .zone { width: 50%; }
  #viewer[data-kind="embed"] .zone { width: 9%; top: 10%; bottom: 22%; }
  #viewer[data-single] .zone { display: none; }

  /* details: a text overlay on the work, up while the pointer moves, gone when it rests */
  .chrome { position: absolute; z-index: 3; transition: opacity .5s; }
  #viewer.idle .chrome { opacity: 0; pointer-events: none; }
  #close { top: max(18px, env(safe-area-inset-top)); right: 22px; font-size: 13px; padding: 8px; color: var(--ink); text-shadow: 0 0 8px #000; }
  #count { top: max(26px, env(safe-area-inset-top)); left: 30px; font-size: 13px; color: var(--ink); text-shadow: 0 0 8px #000; font-variant-numeric: tabular-nums; }
  #details {
    left: 0; right: 0; bottom: 0;
    padding: 20vh clamp(20px, 3vw, 40px) max(26px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.55) 42%, rgba(0,0,0,.86));
    pointer-events: none;
    display: grid; grid-template-columns: minmax(0, 30em) minmax(0, 32em); gap: .3em 3em; align-items: end;
  }
  #viewer[data-kind="embed"] #details { bottom: 56px; padding-top: 8vh; }
  #details h2 { font-size: 21px; font-weight: 400; letter-spacing: -.01em; margin: 0 0 .4em; }
  #details h2 .year { color: var(--dim); }
  #details p { margin: 0; }
  #details .materials { color: #c9c9c6; }
  #details .spec { color: var(--dim); font-variant-numeric: tabular-nums; margin-top: .25em; }
  #details .text { color: #d8d8d5; max-width: 34em; }
  #details .caption { color: var(--dim); margin-top: .5em; }

  @media (max-width: 700px) {
    #details { grid-template-columns: 1fr; padding-top: 12vh; gap: .6em; }
    #viewer[data-kind="image"] .zone { width: 35%; }
    .zone { font-size: 26px; }
  }
  @media (hover: none) {
    /* no hover on phones: the overlay stays up until tapped away */
    #viewer.idle .chrome { opacity: 1; pointer-events: auto; }
    #viewer.hush .chrome { opacity: 0; pointer-events: none; }
    #viewer.hush #close { opacity: 1; pointer-events: auto; }
  }
</style>
</head>
<body>

<!-- eyewall: the viewer's own eyes on the wall, only while they look at the lens.
     Everything stays on their device — nothing is uploaded, recorded or sent. -->
<canvas id="wall" aria-hidden="true"></canvas>
<video id="cam" autoplay muted playsinline aria-hidden="true"></video>

<header>
  <h1>Danyela June Brown</h1>
  <p>Selected Projects</p>
</header>

<main>
  <ol id="list"></ol>
</main>

<div id="viewer" hidden>
  <div id="stage"></div>
  <button class="zone prev" aria-label="Previous view">‹</button>
  <button class="zone next" aria-label="Next view">›</button>
  <div id="count" class="chrome"></div>
  <button id="close" class="chrome" aria-label="Close">Close ✕</button>
  <div id="details" class="chrome"></div>
</div>

<script>
/*
  THE CONTENT. Edit here.

  One entry per work, in the order they should be listed. Wording and formatting
  follow Danyela's own portfolio PDF (Downloads/Danyela June brown_Portfolio.pdf):
  title and year, then materials, then dimensions and running time, then the line
  about the work.

  media is shown full screen in this order; more than one = click through.
    { type: "image",   src: "media/file.jpg" }
    { type: "video",   src: "media/file.mp4" }   (H.264 .mp4 — .MOV/HEVC won't play in Chrome)
    { type: "site",    src: "https://…" }      a live page, running inside the view
    { type: "youtube", id:  "VIDEO_ID" }       (leaves YouTube's logo and channel on the work)
    { type: "vimeo",   id:  "VIDEO_ID" }
  Any media item can carry a caption: "…" (e.g. the angle, or who shot it).
  Leave a field "" and it simply won't appear.
*/
const PROJECTS = [
  {
    id: "dysaesthesia-aethiopica",
    title: "dysaesthesia aethiopica",
    year: "2025",
    materials: "video performance, drywall, raspberry pi, viewfinder, video, lace frontal, Bestway inflatable raft, Yurugu (Marimba Ani), tripod, personal iPhone, work iPhone, charger bank, charger cable, McChicken, phonecall",
    dims: "8” x 10” x 6”",
    trt: "TRT: 06:00:00",
    text: "Installation of epic Sawkill Creek voyage: reading aloud, rehearsing MFA crit on a speaker, and plummeting over damn",
    // self-hosted, not YouTube: no logo, no channel name, no way out to the channel
    media: [
      { type: "video", src: "media/dysaesthesia-aethiopica.mp4" },
      { type: "image", src: "media/dysaesthesia-aethiopica-1.jpg" },
    ],
  },
  {
    id: "asili",
    title: "Asili",
    year: "2025",
    materials: "Bestway inflatable raft, lace frontal, carabiner, Gorilla glue, spray paint",
    dims: "83” x 39” x 24”",
    trt: "",
    text: "set and costume pieces from dysaesthesia aethiopica; install photo from MFA 1st year show",
    media: [
      { type: "video", src: "media/asili.mp4" },   // the video on loop, nothing else
    ],
  },
  {
    id: "studio-practice",
    title: "STUDIO PRACTICE",
    year: "2024",
    materials: "cam-performance, found boat, peg board, cordless drill, screws, Black Looks: Race and Representation (bell hooks)",
    dims: "",
    trt: "TRT: 03:00:00",
    text: "Score: artist rows to lake center, assembles a sign on the starboard side, finishes reading Black Looks, returns to shore",
    media: [
      { type: "youtube", id: "BRNuK34OCKI", caption: "excerpt" },
    ],
  },
  {
    id: "rip-dream-johnson",
    title: "untitled (RIP Dream Johnson)",
    year: "2025",
    materials: "live performance, t-shirt, Modpodge, inkjet transfer, two plastic bags, polyester scarf, New Balance slides",
    dims: "12.5” x 8.5” x 1”",
    trt: "TRT: 02:15:00",
    text: "Score: artist ties plastic bags over her locs and puts on Dream Johnson memorial t-shirt, hears something unkind, sprints to Rock Creek and floats to the Potomac River at Lock 0.",
    media: [
      { type: "youtube", id: "VL3bCHgXNmo" },
    ],
  },
  {
    id: "all-the-feels",
    title: "All The Feels",
    year: "2025",
    materials: "diary card entries, HTML, CSS, JavaScript, Supabase",
    dims: "",
    trt: "TRT: 9/22/25—Ongoing",
    text: "I have been tracking my emotions and use of re-regulation/mindfulness skills here. This is the past seven days worth of entries.",
    media: [
      { type: "image", src: "media/all-the-feels-1.jpg" },
      { type: "image", src: "media/all-the-feels-report-1.jpg", caption: "diary card, 12–18 September 2026" },
      { type: "site", src: "https://danyelajunebrown.github.io/toolbelt/the-feels/index.html",
        caption: "the live app" },
    ],
  },
  {
    id: "out-the-doll-house-ii",
    title: "Out The Doll House II",
    year: "",          // TODO(Danyela): not in the portfolio PDF — year, materials, dims, TRT, line
    materials: "",
    dims: "",
    trt: "",
    text: "",
    media: [
      { type: "youtube", id: "ETBAGdcVCH8", caption: "excerpt" },
    ],
  },
];

const $ = (s) => document.querySelector(s);
const list = $("#list"), viewer = $("#viewer"), stage = $("#stage"),
      details = $("#details"), count = $("#count");
let current = null, index = 0, idleTimer = 0;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const titleLine = (p) => esc(p.title) + (p.year ? ` <span class="year">(${esc(p.year)})</span>` : "");

// ---------- index ----------
for (const p of PROJECTS) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.innerHTML = titleLine(p);
  if (!p.media.length) b.dataset.empty = "";
  b.addEventListener("click", () => { if (p.media.length) location.hash = p.id; });
  li.append(b);
  list.append(li);
}

// ---------- viewer ----------
function render() {
  const p = current, m = p.media[index];
  viewer.dataset.kind = m.type === "image" ? "image" : "embed";
  viewer.toggleAttribute("data-single", p.media.length < 2);
  count.textContent = p.media.length > 1 ? `${index + 1} / ${p.media.length}` : "";

  stage.replaceChildren();
  if (m.type === "image") {
    const img = new Image();
    img.src = m.src;
    img.alt = m.caption || p.title;
    stage.append(img);
  } else if (m.type === "video") {
    const v = document.createElement("video");
    Object.assign(v, { src: m.src, controls: true, loop: true, playsInline: true });
    stage.append(v);
    v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
  } else if (m.type === "site") {
    // a live page as a view of the work — it runs, it is not a picture of running
    const f = document.createElement("iframe");
    f.src = m.src;
    f.allow = "camera; microphone; fullscreen";
    f.title = p.title;
    stage.append(f);
  } else if (m.type === "youtube" || m.type === "vimeo") {
    const f = document.createElement("iframe");
    f.src = m.type === "youtube"
      ? `https://www.youtube-nocookie.com/embed/${m.id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`
      : `https://player.vimeo.com/video/${m.id}?autoplay=1&title=0&byline=0&portrait=0`;
    f.allow = "autoplay; fullscreen; picture-in-picture";
    f.allowFullscreen = true;
    f.title = p.title;
    stage.append(f);
  }

  const spec = [p.dims, p.trt].filter(Boolean).join("  |  ");
  details.innerHTML = `
    <div>
      <h2>${titleLine(p)}</h2>
      ${p.materials ? `<p class="materials">${esc(p.materials)}</p>` : ""}
      ${spec ? `<p class="spec">${esc(spec)}</p>` : ""}
    </div>
    <div>
      ${p.text ? `<p class="text">${esc(p.text)}</p>` : ""}
      ${m.caption ? `<p class="caption">${esc(m.caption)}</p>` : ""}
    </div>`;

  // warm the next image so clicking through doesn't flash
  const nx = p.media[(index + 1) % p.media.length];
  if (nx && nx.type === "image") new Image().src = nx.src;
  wake();
}

function step(d) {
  if (!current || current.media.length < 2) return;
  index = (index + d + current.media.length) % current.media.length;
  render();
}

function open(p) {
  current = p; index = 0;
  viewer.hidden = false;
  document.body.style.overflow = "hidden";
  render();
}

function close() {
  current = null;
  stage.replaceChildren(); // stops video/embed audio
  viewer.hidden = true;
  document.body.style.overflow = "";
}

// Hash = which work is open, so the browser back button closes it.
function route() {
  const p = PROJECTS.find((x) => x.id === location.hash.slice(1) && x.media.length);
  p ? (p !== current && open(p)) : current && close();
}
addEventListener("hashchange", route);
route();

function leave() { history.length > 1 && location.hash ? history.back() : (location.hash = ""); }

// the overlay shows while the pointer moves and fades when it rests
function wake() {
  viewer.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewer.classList.add("idle"), 2400);
}
viewer.addEventListener("mousemove", wake);

$(".zone.prev").addEventListener("click", () => step(-1));
$(".zone.next").addEventListener("click", () => step(1));
$("#close").addEventListener("click", leave);
// phones: tapping the middle of an image toggles the overlay
stage.addEventListener("click", () => viewer.classList.toggle("hush"));

addEventListener("keydown", (e) => {
  if (!current) return;
  if (e.key === "Escape") leave();
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
});

// swipe
let x0 = null;
viewer.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
viewer.addEventListener("touchend", (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  x0 = null;
});
</script>

<script type="module">
/*
  eyewall — the page's ground, and the condition of the page.

  Finds every face the camera sees and paints only the eyes, and only while they
  are pointed at the lens. Look away, look down or blink and they stop. The video
  never leaves this device: no upload, no recording, no server.

  It asks on load, the way the landing page of danyelajunebrown.github.io does.
  There is nothing to opt into and no button to miss; refusing the camera leaves
  the list on plain black.

  Values are the ones settled in the prototype; there are no on-screen controls.
*/
const TOL = 0.34;      // how far a look may depart from the lens before it stops
const STRETCH = 1.0;   // vertical spread of eyes across the wall
const SIZE = 1.3;      // eye size on the wall
const FEATHER = 0.6;   // softness of each eye's edge

const wall = document.getElementById("wall");
const wctx = wall.getContext("2d");
const video = document.getElementById("cam");
const eyeC = document.createElement("canvas");
const ectx = eyeC.getContext("2d");
const viewerEl = document.getElementById("viewer");

const EYES = [
  { iris: 468, outer: 33,  inner: 133, side: "Left"  },
  { iris: 473, outer: 362, inner: 263, side: "Right" },
];
const NOSE = 1, EDGE_L = 234, EDGE_R = 454;

let landmarker = null, running = false, lastTs = -1;

function fitWall() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  wall.width = Math.round(innerWidth * dpr);
  wall.height = Math.round(innerHeight * dpr);
}
fitWall();
addEventListener("resize", fitWall);
addEventListener("orientationchange", () => setTimeout(fitWall, 300));

const bsMap = (bs) => {
  const m = {};
  for (const c of bs?.categories || []) m[c.categoryName] = c.score;
  return m;
};

// head yaw from nose/edge asymmetry: 0 frontal, ±1 profile
function headYaw(lm) {
  const n = lm[NOSE], l = lm[EDGE_L], r = lm[EDGE_R];
  const dL = Math.hypot(n.x - l.x, n.y - l.y);
  const dR = Math.hypot(n.x - r.x, n.y - r.y);
  return (dR - dL) / (dR + dL + 1e-6);
}

// 0 = straight at the lens; grows as the look departs
function gazeScore(lm, b) {
  const eh = Math.max(b.eyeLookOutLeft || 0, b.eyeLookInLeft || 0, b.eyeLookOutRight || 0, b.eyeLookInRight || 0);
  const ev = Math.max(b.eyeLookUpLeft || 0, b.eyeLookDownLeft || 0, b.eyeLookUpRight || 0, b.eyeLookDownRight || 0);
  return Math.abs(headYaw(lm)) * 1.7 + eh * 0.9 + ev * 0.7;
}

function drawEye(cx, cy, halfW) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const sw = halfW * 2 * vw;
  const sh = sw * 0.62;
  if (sw < 3 || sh < 3) return;
  const sx = cx * vw - sw / 2;
  const sy = cy * vh - sh / 2;

  const cw = Math.max(4, Math.round(Math.min(sw, 420)));
  const ch = Math.max(4, Math.round(cw * (sh / sw)));
  if (eyeC.width !== cw || eyeC.height !== ch) { eyeC.width = cw; eyeC.height = ch; }

  ectx.globalCompositeOperation = "source-over";
  ectx.clearRect(0, 0, cw, ch);
  ectx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
  ectx.globalCompositeOperation = "destination-in";
  ectx.save();
  ectx.translate(cw / 2, ch / 2);
  ectx.scale(1, ch / cw);
  const g = ectx.createRadialGradient(0, 0, 0, 0, 0, cw / 2);
  g.addColorStop(0, "rgba(0,0,0,1)");
  g.addColorStop(FEATHER, "rgba(0,0,0,1)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ectx.fillStyle = g;
  ectx.fillRect(-cw / 2, -cw / 2, cw, cw);
  ectx.restore();

  const W = wall.width, H = wall.height;
  const dw = halfW * 2 * W * SIZE;
  const dh = dw * (sh / sw);
  wctx.save();
  wctx.globalCompositeOperation = "screen";
  wctx.translate((1 - cx) * W, (0.5 + (cy - 0.5) * STRETCH) * H);
  wctx.scale(-1, 1);          // mirrored, so a viewer meets their own eye
  wctx.drawImage(eyeC, -dw / 2, -dh / 2, dw, dh);
  wctx.restore();
}

function loop() {
  if (!running) return;
  // a work is open full screen: nothing to paint behind it
  if (!viewerEl.hidden) { requestAnimationFrame(loop); return; }

  if (video.readyState >= 2 && video.currentTime !== lastTs) {
    lastTs = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());

    wctx.setTransform(1, 0, 0, 1, 0, 0);
    wctx.globalCompositeOperation = "source-over";
    wctx.fillStyle = "#000";
    wctx.fillRect(0, 0, wall.width, wall.height);

    const faces = res.faceLandmarks || [];
    const shapes = res.faceBlendshapes || [];
    for (let f = 0; f < faces.length; f++) {
      const lm = faces[f], b = bsMap(shapes[f]);
      if (gazeScore(lm, b) > TOL) continue;               // not looking: paint nothing
      for (const e of EYES) {
        if ((b["eyeBlink" + e.side] || 0) > 0.5) continue; // a closed eye is not a look
        const iris = lm[e.iris], o = lm[e.outer], i = lm[e.inner];
        if (!iris || !o || !i) continue;
        drawEye(iris.x, iris.y, Math.hypot(o.x - i.x, o.y - i.y) * 0.8);
      }
    }
  }
  requestAnimationFrame(loop);
}

async function start() {
  try {
    // ask for the camera first, so the permission dialog appears as the page
    // loads rather than after a detector download
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "user" }, width: { ideal: 1280 }, height: { ideal: 720 } },
    });
    await video.play();

    const { FaceLandmarker, FilesetResolver } =
      await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numFaces: 5,
      outputFaceBlendshapes: true,
      outputFacialTransformationMatrixes: false,
    });
    running = true;
    loop();
  } catch (e) {
    // refused camera, no camera, or the CDN is unreachable: the page is simply black
    running = false;
    if (video.srcObject) { video.srcObject.getTracks().forEach((t) => t.stop()); video.srcObject = null; }
  }
}

if (navigator.mediaDevices?.getUserMedia) start();
</script>
</body>
</html>
